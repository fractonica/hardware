# T2-FLOOD-30 (design m2-c2 §2.2, §5.4): T-FLOOD's own verdict at 30 nodes in one room. One cut-off node, then three
# spread over the RSSI range; the cut nodes are on the bridge, so T-FLOOD reads their counters during the hook as on
# the bench (t-flood.ts). The transmission bound (<= 8 seeds per broadcast, proposed) is gated collision-free (D10);
# t2-flood-30-collisions publishes the same runs with collisions on. Every run names all 30 nodes (--devices), so a node
# offline at a run's start fails it instead of dropping out of the verdict (the runner checks that too).
schema: fractonica/sim-scenario@1
id: t2-flood-30
gate: T2-FLOOD-30
summary: T-FLOOD's verdict at 30 nodes in one room, 1 and 3 cut-off nodes
nodes:
  count: 30                 # sim-01 .. sim-30, MACs 02:f2:00:00:00:01 ..
  profile: c6-pad
  hb_ms: 1000
  usb: [sim-07, sim-18, sim-29]   # the cut nodes, so T-FLOOD's in-hook read runs as on the bench
  spares: 0
seed: 1
medium:
  topology: one_room
  rssi_dbm: [-85, -45]
  loss: [0.001, 0.015]
  rate: { broadcast: 1M, unicast: 1M }
  collisions: false         # the transmission bound is gated collision-free (D10); t2-flood-30-collisions publishes it with collisions on
  capture_db: 10
ap: { channel: 6, uplink_ms: [0.5, 3], downlink_ms: [0.5, 3], udp_loss: 0 }
storm: { stagger_ms: 0 }
runs:
  - name: cut-1
    run: t-flood
    args: [--devices, 'sim-01..sim-30', --cut, sim-07, --count, '1000', --interval-ms, '100', --max-seeds, '8', --min-delivery, '99.9']
  - name: cut-3
    run: t-flood
    args: [--devices, 'sim-01..sim-30', --cut, 'sim-07,sim-18,sim-29', --count, '1000', --interval-ms, '100', --max-seeds, '8', --min-delivery, '99.9']
published: false
