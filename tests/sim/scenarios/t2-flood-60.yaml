# Published (design m2-c2 §5.3, D16): 60 nodes. The reconnect storm at 0 ms stagger (the scenario's own), then again
# at 100 and 1,000 ms (the runner's storm step powers every node off and on again, that far apart), then T-FLOOD with
# one cut node. The storm figures, fan-out cost and loop lag at 60 are what C9 and the scale limit read.
schema: fractonica/sim-scenario@1
id: t2-flood-60
summary: the storm at 0, 100 and 1,000 ms stagger and T-FLOOD at 60 nodes in one room
nodes:
  count: 60
  profile: c6-pad
  hb_ms: 1000
  usb: [sim-07]
seed: 1
medium:
  topology: one_room
  rssi_dbm: [-85, -45]
  loss: [0.001, 0.015]
  rate: { broadcast: 1M, unicast: 1M }
  collisions: false
  capture_db: 10
ap: { channel: 6, uplink_ms: [0.5, 3], downlink_ms: [0.5, 3], udp_loss: 0 }
storm: { stagger_ms: 0 }
runs:
  - name: storm-100
    run: storm
    args: [--stagger-ms, '100']
  - name: storm-1000
    run: storm
    args: [--stagger-ms, '1000']
  - name: cut-1
    run: t-flood
    args: [--devices, 'sim-01..sim-60', --cut, sim-07, --count, '1000', --interval-ms, '100', --max-seeds, '1000', --min-delivery, '99.9']
published: true
