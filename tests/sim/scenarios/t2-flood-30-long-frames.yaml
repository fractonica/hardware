# Published (design m2-c2 D10): the 30-node flood with longer hub broadcasts. The gated bound holds only for short
# frames (<= 64 B of envelope); about 120 B and 200 B of envelope come from MSG data of 70 and 150 bytes
# (t-flood --data-bytes). Collision-free, as the gated runs, so the figures compare with the survey's Monte Carlo.
schema: fractonica/sim-scenario@1
id: t2-flood-30-long-frames
summary: T-FLOOD at 30 nodes with about 120 B and 200 B hub broadcasts (transmissions grow with airtime)
nodes:
  count: 30
  profile: c6-pad
  hb_ms: 1000
  usb: [sim-07]
seed: 1
medium:
  topology: one_room
  rssi_dbm: [-85, -45]
  loss: [0.001, 0.015]
  rate: { broadcast: 1M, unicast: 1M }
  collisions: false
  capture_db: 10
ap: { channel: 6, uplink_ms: [0.5, 3], downlink_ms: [0.5, 3], udp_loss: 0 }
runs:
  - name: frames-120
    run: t-flood
    args: [--devices, 'sim-01..sim-30', --cut, sim-07, --count, '1000', --interval-ms, '100', --max-seeds, '1000', --min-delivery, '99.9', --data-bytes, '70']
  - name: frames-200
    run: t-flood
    args: [--devices, 'sim-01..sim-30', --cut, sim-07, --count, '1000', --interval-ms, '100', --max-seeds, '1000', --min-delivery, '99.9', --data-bytes, '150']
published: true
