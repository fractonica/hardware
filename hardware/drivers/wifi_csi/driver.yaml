# Driver manifest (design csi-c1 D7, D8; spec 07 §7.8). Nothing on the board: the radio is the chip's own, so the
# profile's instance has no `bind` (codegen's binds: none). Its `sdkconfig` turns CSI on in every profile that binds
# it. Stream F implements it (CSI-1).
schema: fractonica/driver@1
id: wifi_csi
summary: Wi-Fi channel state information from the chip's own radio (esp_wifi CSI), the router source's pings to the default gateway (lwIP esp_ping), each valid record handed to CsiService.
implements: hal.CsiSource
class: fr::drv::WifiCsi                 # header: include/fr/drv/wifi_csi.hpp
# SOC_WIFI_CSI_SUPPORT on all four (IDF v6.1 soc_caps.h); the C5 is MAC v3 (wifi_csi_acquire_config_t: LLTF, HT,
# VHT, HE), the others take wifi_csi_config_t (LLTF, HT-LTF, STBC). Benched on the C5 only.
targets: [esp32c3, esp32c5, esp32c6, esp32s3]
binds: none
accepts_kinds: [none]
config: {}
resources: {}
sdkconfig:
  - CONFIG_ESP_WIFI_CSI_ENABLED=y
  # CSI grows every static RX buffer by 512 B (2,212 B each). On the C5 bench board (no PSRAM, one SRAM for code and
  # data) the default 10 buffers plus the IRAM-resident Wi-Fi/lwIP code left esp_wifi_init short (ESP_ERR_NO_MEM,
  # 8 of 10 buffers, CSI-1 bench): a sensor needs neither, so 6 buffers and the Wi-Fi/lwIP code back in flash.
  - CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM=6
  - CONFIG_ESP_WIFI_IRAM_OPT=n
  - CONFIG_ESP_WIFI_RX_IRAM_OPT=n
  - CONFIG_LWIP_IRAM_OPTIMIZATION=n
dependencies: {}
