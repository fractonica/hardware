# Driver manifest (design c2 §6, spec 07 §7.8). `fr gen firmware` validates profiles against it and
# fills fr::drv::LedWs2812::Config from the bound board entry.
schema: fractonica/driver@1
id: led_ws2812
summary: One WS2812 RGB pixel on an RMT TX channel (espressif/led_strip); rgb and dimmable.
implements: hal.LightOutput
class: fr::drv::LedWs2812               # header: include/fr/drv/led_ws2812.hpp
targets: [esp32c3, esp32c5, esp32c6, esp32s3]
binds: leds
accepts_kinds: [ws2812]
config:                                 # same order as LedWs2812::Config
  gpio:        { type: gpio, from: board.gpio }
  color_order: { type: enum, values: [GRB, RGB], from: board.color_order, default: GRB }
cap_config:                             # fr.led config defaults for this driver (spec 04 §4.6)
  max_brightness: 64                    # full white is blinding and draws ~60 mA
traits: { color: rgb, dimmable: true }  # fr.led traits its service reports (features() is rgb and dimmable; design c6 D13)
resources: { gpio: 1, rmt_tx: 1 }
dependencies: { espressif/led_strip: "==3.1.0~1" }   # must match idf_component.yml
