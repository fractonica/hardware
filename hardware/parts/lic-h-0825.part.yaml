schema: fractonica/part@1
id: lic-h-0825
name: LIC-H-0825 lithium-ion capacitor, 90 F
category: cell
summary: 8 × 25 mm lithium-ion capacitor (H series), 90 F ≈ 50 mAh, 2.5–4.0 V; for bursts (motors, solenoids).
specs:
  capacitance: 90 F (±20 %)
  equivalent_capacity: about 50 mAh
  working_range: 2.5–4.0 V
  min_voltage: 2.5 V (below this the cell is damaged)
  surge_voltage: 4.2 V
  max_charge: 4.2 V / 1 A
  esr: ≤ 250 mΩ AC (1 kHz), ≤ 600 mΩ DC
  current: 500 mA continuous, 2.5 A for 1 s
  cycle_life: ≥ 8,000
  pin_pitch: 3.5 mm
pins:
  - { name: "+ (long leg / unmarked)", desc: "check the sleeve's stripe: the stripe usually marks −" }
  - { name: "−", desc: "" }
notes:
  - "NOT an EDLC supercapacitor: never discharge it to 0 V or short it. The firmware floor is 2.7 V; loads refuse to start below 2.8 V (3.1 V for the solenoid)."
  - "Charges from a TP4056 in about 2 minutes at 1 A (C·ΔV/I)."
  - "Store it charged to about 3.8 V, not empty."
inferred: []
