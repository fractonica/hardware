<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 340" role="img"><title>Test load NPN switch on GPIO11</title><desc>LiPo OUT+ through a 100 Ω resistor to the NPN collector, emitter to ground, GPIO11 to the base through 1 kΩ. No diode: a resistor has no inductance worth clamping.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="ts" x="340" y="40" text-anchor="middle">LiPo OUT+ (TP4056 #1, 3.0–4.2 V)</text>
<g fill="none" stroke="#D85A30" stroke-width="1.5"><path d="M340 52 V104"/></g>
<g class="c-amber"><rect x="330" y="104" width="20" height="52" rx="2" stroke-width="0.5"/></g>
<text class="ts" x="304" y="100" text-anchor="end">Load resistor</text>
<text class="ts" x="304" y="118" text-anchor="end">100 Ω, ≥ ¼ W</text>
<path d="M340 156 V208" fill="none" stroke="var(--s)" stroke-width="1.5"/>
<circle cx="330" cy="232" r="28" fill="none" stroke="var(--s)" stroke-width="1"/>
<line x1="318" y1="218" x2="318" y2="246" stroke="var(--p)" stroke-width="2.5"/>
<path d="M318 224 L340 210" fill="none" stroke="var(--p)" stroke-width="1.5"/>
<path d="M318 240 L338 252" fill="none" stroke="var(--p)" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 256 V300" fill="none" stroke="var(--s)" stroke-width="1.5"/>
<text class="ts" x="350" y="210">C</text><text class="ts" x="350" y="266">E</text><text class="ts" x="300" y="222" text-anchor="end">B</text>
<text class="ts" x="372" y="236">NPN (S8050 / 2N2222)</text>
<path d="M150 232 H190 M250 232 H318" fill="none" stroke="var(--s)" stroke-width="1.5"/>
<g class="c-amber"><rect x="190" y="224" width="60" height="16" rx="2" stroke-width="0.5"/></g>
<text class="ts" x="220" y="212" text-anchor="middle">1 kΩ</text>
<g class="c-teal"><rect x="60" y="216" width="90" height="32" rx="6" stroke-width="0.5"/><text class="th" x="105" y="232" text-anchor="middle" dominant-baseline="central">GPIO11</text></g>
<g stroke="var(--p)" stroke-width="1.5"><line x1="322" y1="300" x2="358" y2="300"/><line x1="328" y1="306" x2="352" y2="306"/><line x1="334" y1="312" x2="346" y2="312"/></g>
<text class="ts" x="370" y="306">GND</text>
</svg>
