<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 340" role="img"><title>Coin motor NPN driver on GPIO14</title><desc>Capacitor OUT+ to the motor +, motor − to the NPN collector, emitter to ground, GPIO14 to the base through 470 Ω, a diode across the motor with the stripe toward +.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="ts" x="340" y="40" text-anchor="middle">Capacitor OUT+ (2.7–4.2 V)</text>
<g fill="none" stroke="#D85A30" stroke-width="1.5"><path d="M340 52 V104"/><path d="M340 80 H440 V110"/></g>
<circle cx="340" cy="80" r="4" fill="#D85A30"/>
<line x1="428" y1="110" x2="452" y2="110" stroke="var(--p)" stroke-width="2.5"/>
<polygon points="428,134 452,134 440,110" fill="none" stroke="var(--p)" stroke-width="1.5"/>
<text class="ts" x="462" y="116">1N4148 / 1N4007</text>
<text class="ts" x="462" y="134">stripe (bar) to +</text>
<path d="M440 134 V180 H340" fill="none" stroke="var(--s)" stroke-width="1.5"/><circle cx="340" cy="180" r="4" fill="var(--s)"/>
<g class="c-coral"><circle cx="340" cy="130" r="26" stroke-width="0.5"/><text class="th" x="340" y="130" text-anchor="middle" dominant-baseline="central">M</text></g>
<text class="ts" x="304" y="100" text-anchor="end">Coin motor</text>
<text class="ts" x="304" y="118" text-anchor="end">red lead up (+)</text>
<path d="M340 156 V208" fill="none" stroke="var(--s)" stroke-width="1.5"/>
<circle cx="330" cy="232" r="28" fill="none" stroke="var(--s)" stroke-width="1"/>
<line x1="318" y1="218" x2="318" y2="246" stroke="var(--p)" stroke-width="2.5"/>
<path d="M318 224 L340 210" fill="none" stroke="var(--p)" stroke-width="1.5"/>
<path d="M318 240 L338 252" fill="none" stroke="var(--p)" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 256 V300" fill="none" stroke="var(--s)" stroke-width="1.5"/>
<text class="ts" x="350" y="210">C</text><text class="ts" x="350" y="266">E</text><text class="ts" x="300" y="222" text-anchor="end">B</text>
<text class="ts" x="372" y="236">NPN (S8050 / 2N2222)</text>
<path d="M150 232 H190 M250 232 H318" fill="none" stroke="var(--s)" stroke-width="1.5"/>
<g class="c-amber"><rect x="190" y="224" width="60" height="16" rx="2" stroke-width="0.5"/></g>
<text class="ts" x="220" y="212" text-anchor="middle">470 Ω</text>
<g class="c-teal"><rect x="60" y="216" width="90" height="32" rx="6" stroke-width="0.5"/><text class="th" x="105" y="232" text-anchor="middle" dominant-baseline="central">GPIO14</text></g>
<g stroke="var(--p)" stroke-width="1.5"><line x1="322" y1="300" x2="358" y2="300"/><line x1="328" y1="306" x2="352" y2="306"/><line x1="334" y1="312" x2="346" y2="312"/></g>
<text class="ts" x="370" y="306">GND</text>
</svg>
