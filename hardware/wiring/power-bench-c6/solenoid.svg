<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 480" role="img"><title>Solenoid driver on GPIO5 with two NPNs and an IRF530N</title><desc>GPIO5 with a 10 kΩ pull-down drives Q1's base through 1 kΩ; Q1's collector has a 10 kΩ pull-up to the C6 5V pin and drives Q2's base; Q2's collector has a 1 kΩ pull-up to 5V and drives the IRF530N gate; the drain goes to the solenoid's −, the solenoid's + to the capacitor OUT+, a 1N4007 across the solenoid with the stripe toward +.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="ts" x="222" y="74" text-anchor="end">C6 5V pin</text>
<path d="M230 70 H416" fill="none" stroke="#D85A30" stroke-width="1.5"/>
<g fill="none" stroke="var(--s)" stroke-width="1.5">
<path d="M256 70 V120 M256 170 V278"/><path d="M416 70 V120 M416 170 V278"/>
<path d="M256 230 H340 V300 H398"/><path d="M416 230 H480 V360 H520"/>
<path d="M110 300 H160 M215 300 H238"/><path d="M140 300 V330 M140 380 V420"/>
<path d="M256 322 V420 M416 322 V420 M560 390 V420 M140 420 H600"/>
<path d="M560 260 V330"/><path d="M630 199 V285 H560"/><path d="M560 150 H630 V175"/></g>
<path d="M560 110 V200" fill="none" stroke="#D85A30" stroke-width="1.5"/>
<text class="ts" x="560" y="98" text-anchor="middle">Cap OUT+</text>
<g fill="var(--s)"><circle cx="140" cy="300" r="4"/><circle cx="256" cy="230" r="4"/><circle cx="416" cy="230" r="4"/><circle cx="560" cy="285" r="4"/><circle cx="256" cy="70" r="4"/></g>
<circle cx="560" cy="150" r="4" fill="#D85A30"/>
<g class="c-amber"><rect x="248" y="120" width="16" height="50" rx="2" stroke-width="0.5"/><rect x="408" y="120" width="16" height="50" rx="2" stroke-width="0.5"/><rect x="160" y="292" width="55" height="16" rx="2" stroke-width="0.5"/><rect x="132" y="330" width="16" height="50" rx="2" stroke-width="0.5"/></g>
<text class="ts" x="240" y="149" text-anchor="end">10 kΩ</text>
<text class="ts" x="400" y="149" text-anchor="end">1 kΩ</text>
<text class="ts" x="187" y="282" text-anchor="middle">1 kΩ</text>
<text class="ts" x="124" y="359" text-anchor="end">10 kΩ</text>
<g class="c-teal"><rect x="40" y="284" width="70" height="32" rx="6" stroke-width="0.5"/><text class="th" x="75" y="300" text-anchor="middle" dominant-baseline="central">GPIO5</text></g>
<circle cx="250" cy="300" r="24" fill="none" stroke="var(--s)" stroke-width="1"/>
<line x1="238" y1="286" x2="238" y2="314" stroke="var(--p)" stroke-width="2.5"/>
<path d="M238 292 L256 278" fill="none" stroke="var(--p)" stroke-width="1.5"/>
<path d="M238 308 L254 320" fill="none" stroke="var(--p)" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="th" x="284" y="300" dominant-baseline="central">Q1</text>
<circle cx="410" cy="300" r="24" fill="none" stroke="var(--s)" stroke-width="1"/>
<line x1="398" y1="286" x2="398" y2="314" stroke="var(--p)" stroke-width="2.5"/>
<path d="M398 292 L416 278" fill="none" stroke="var(--p)" stroke-width="1.5"/>
<path d="M398 308 L414 320" fill="none" stroke="var(--p)" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="th" x="444" y="300" dominant-baseline="central">Q2</text>
<g class="c-purple"><rect x="520" y="330" width="80" height="60" rx="6" stroke-width="0.5"/><text class="th" x="560" y="352" text-anchor="middle" dominant-baseline="central">IRF530N</text><text class="ts" x="560" y="372" text-anchor="middle" dominant-baseline="central">G left D top</text></g>
<text class="ts" x="568" y="404">S</text>
<g class="c-coral"><rect x="525" y="200" width="70" height="60" rx="6" stroke-width="0.5"/><text class="th" x="560" y="230" text-anchor="middle" dominant-baseline="central">Solenoid</text></g>
<line x1="618" y1="175" x2="642" y2="175" stroke="var(--p)" stroke-width="2.5"/>
<polygon points="618,199 642,199 630,175" fill="none" stroke="var(--p)" stroke-width="1.5"/>
<text class="ts" x="600" y="430" dominant-baseline="central">GND</text>
<text class="ts" x="340" y="458" text-anchor="middle">GPIO high → Q1 on → Q2 off → gate pulled to 5 V → solenoid on</text>
</svg>
