<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 430" role="img"><title>Voltage divider from TP4056 OUT+ to GPIO0</title><desc>OUT+ through R1 1 MΩ to a middle node, R2 1 MΩ from the node to ground, 100 nF from the node to ground, the node to GPIO0. GPIO1 uses an identical set on TP4056 #2.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="40" y="70" width="150" height="260" rx="8" stroke-width="0.5"/>
<text class="th" x="115" y="98" text-anchor="middle" dominant-baseline="central">TP4056 #1</text>
<text class="ts" x="115" y="118" text-anchor="middle" dominant-baseline="central">(#2 for GPIO1)</text>
<text class="th" x="180" y="150" text-anchor="end" dominant-baseline="central">OUT+</text>
<text class="th" x="180" y="310" text-anchor="end" dominant-baseline="central">OUT−</text></g>
<g class="c-teal"><rect x="540" y="180" width="100" height="220" rx="8" stroke-width="0.5"/>
<text class="th" x="590" y="205" text-anchor="middle" dominant-baseline="central">scale-c6</text>
<text class="th" x="550" y="255" dominant-baseline="central">GPIO0</text>
<text class="th" x="550" y="380" dominant-baseline="central">GND</text></g>
<path d="M190 150 H330 V170" fill="none" stroke="#D85A30" stroke-width="1.5"/>
<text class="ts" x="260" y="136" text-anchor="middle">4.2 V full</text>
<g class="c-amber"><rect x="320" y="170" width="20" height="60" rx="2" stroke-width="0.5"/></g>
<text class="th" x="352" y="192" dominant-baseline="central">R1</text>
<text class="ts" x="352" y="210" dominant-baseline="central">1 MΩ</text>
<path d="M330 230 V280" fill="none" stroke="#7F77DD" stroke-width="1.5"/>
<path d="M330 255 H540" fill="none" stroke="#7F77DD" stroke-width="1.5"/>
<circle cx="330" cy="255" r="4" fill="#7F77DD"/><circle cx="450" cy="255" r="4" fill="#7F77DD"/>
<text class="ts" x="390" y="243" text-anchor="middle">2.1 V middle</text>
<g class="c-amber"><rect x="320" y="280" width="20" height="60" rx="2" stroke-width="0.5"/></g>
<text class="th" x="352" y="302" dominant-baseline="central">R2</text>
<text class="ts" x="352" y="320" dominant-baseline="central">1 MΩ</text>
<path d="M450 255 V300" fill="none" stroke="#7F77DD" stroke-width="1.5"/>
<line x1="430" y1="300" x2="470" y2="300" stroke="var(--p)" stroke-width="2.5"/>
<line x1="430" y1="310" x2="470" y2="310" stroke="var(--p)" stroke-width="2.5"/>
<text class="th" x="478" y="296" dominant-baseline="central">C</text>
<text class="ts" x="478" y="314" dominant-baseline="central">100 nF</text>
<path d="M330 340 V380" fill="none" stroke="var(--s)" stroke-width="1.5"/>
<path d="M450 310 V380" fill="none" stroke="var(--s)" stroke-width="1.5"/>
<path d="M190 310 H230 V380 H540" fill="none" stroke="var(--s)" stroke-width="1.5"/>
<circle cx="330" cy="380" r="4" fill="var(--s)"/><circle cx="450" cy="380" r="4" fill="var(--s)"/>
<text class="ts" x="385" y="400" text-anchor="middle">common ground, 0 V</text>
</svg>
