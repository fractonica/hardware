schema: fractonica/board@1
id: doit-espc5-32
name: DOIT ESPC5-32 dev board
# The CSI-1 sensor (design csi-c1 D3): a DOIT ESPC5-32 module on DOIT's dev board, on its native "USB" USB-C port
# (USB-Serial/JTAG). The second USB-C port, "UART", is a USB-UART bridge to UART0, left unused.
# esptool v5.6.0 on the bench unit (2026-11-02): ESP32-C5HF4 revision v1.0, Wi-Fi 6 (dual-band), BT 5 (LE), 802.15.4,
# single core + LP core, 240 MHz, embedded flash 4 MB (XMC, id 0x46/0x4016), no embedded PSRAM, 48 MHz crystal,
# USB VID 0x303A PID 0x1001 with the MAC as its serial.
idf_target: esp32c5
flash: { size: 4MB, mode: dio, part_profile: fr-4mb-v1 }
psram: null
# bcd_device: not read on the bench yet.
usb: { kind: usb_serial_jtag, vid: 0x303A, pid: 0x1001, bcd_device: null, serial_is_mac: true, pins: [13, 14] }
console: usb_serial_jtag
buttons:
  # GPIO28 is the C5's boot-mode strapping pin (IDF v6.1 gpio docs list it); the button on it is inferred from the
  # BOOT silkscreen and Espressif's C5 DevKitC, and confirmed at provisioning.
  boot: { gpio: 28, active_level: low, pull: external, strapping: true, deep_sleep_wake: false, confidence: M }
leds:
  rgb: { gpio: 27, kind: ws2812, color_order: GRB, count: 1, strapping: true, confidence: H }   # silkscreen "RGB@IO27"
pins:
  # 13/14: USB D-/D+ (IDF USB_INT_PHY0_DM/DP_GPIO_NUM); 11/12: U0TXD/U0RXD, to the UART bridge; 16-22: SPI0/1 (SPICS0,
  # SPIQ, SPIWP, VDD_SPI, SPIHD, SPICLK, SPID: the HF4's in-package flash, IDF io_mux_reg.h; not on the headers).
  # GPIO15 (SPICS1) is PSRAM's chip select, free on this PSRAM-less chip.
  reserved: { usb: [13, 14], uart0_bridge: [11, 12], flash: [16, 17, 18, 19, 20, 21, 22] }
  strapping: [2, 7, 25, 27, 28]
  # Inferred from the C5 datasheet's boot table, the C6's 8/9 pattern: GPIO28 low selects download boot, which needs
  # GPIO27 high; 2, 7 and 25 matter only with non-default eFuses (inferred). Confirmed at provisioning.
  strapping_levels: { 2: none, 7: none, 25: none, 27: high, 28: high }
  # The chip's GPIO0-28 (SOC_GPIO_PIN_COUNT 29) less the reserved and strapping pins; 0/1 are the XTAL_32K pads (no
  # 32 kHz crystal on the board, inferred).
  free: [0, 1, 3, 4, 5, 6, 8, 9, 10, 15, 23, 24, 26]
  adc1: [1, 2, 3, 4, 5, 6]     # ADC1_CH0-5 (IDF adc_channel.h); the C5 has no ADC2
# headers: not recorded. The photo shows 3V3, 5V, GND and GPIO 0-10, 13-15, 23-28 on the two rows (inferred: labels
# partly unreadable, the order not read); positions go here once read off the board.
boot_uart_tx: 11              # U0TXD, to the UART bridge: the ROM log prints on it at every boot
en_access: null               # a RESET button; EN on a header not read
rf: { max_tx_power_qdbm: null, antenna: pcb }
test_pin: null                # not on the HIL bench
# IDF v6.1: 2 RMT TX + 2 RX channels, 4 LEDC timers, 6 LEDC channels, 1 HP I2C (the LP I2C is not budgeted, as on the
# C6), 6 ADC1 channels, 1 I2S (esp_hal_rmt, esp_hal_i2s, soc_caps.h for esp32c5).
resources: { rmt_tx: 2, rmt_rx: 2, ledc_timers: 4, ledc_channels: 6, i2c: 1, adc1_channel: 6, i2s: 1 }
defaults:
  boot:   { cap: fr.button, driver: button_gpio, bind: buttons.boot }
  status: { cap: fr.led,    driver: led_ws2812,  bind: leds.rgb }
detection:
  usb: { vid: 0x303A, pid: 0x1001 }
  # esptool says "ESP32-C5HF4 (revision v1.0)"; features name the in-package flash.
  esptool: { chip_type: '^ESP32-C5', features: 'Embedded Flash 4MB', flash_size: 4MB }
  probe: { leds: [rgb] }
sources:
  - https://documentation.espressif.com/esp32-c5_datasheet_en.pdf
  - https://docs.espressif.com/projects/esp-idf/en/v6.1/esp32c5/api-reference/peripherals/gpio.html   # strapping pins, SPI0/1, USB-JTAG
