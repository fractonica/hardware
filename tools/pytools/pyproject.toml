[project]
name = "fractonica-pytools"
version = "0.1.0"
description = "Fractonica hub sidecar: flashing and probing through the esptool Python API (JSON lines over stdio)."
requires-python = ">=3.12"
dependencies = [
    "esptool==5.6.0",
    "esp-idf-nvs-partition-gen==0.3.0",
]

[project.scripts]
fractonica-pytools = "fractonica_pytools.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fractonica_pytools"]
