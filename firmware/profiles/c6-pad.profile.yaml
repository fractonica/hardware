profile: c6-pad
board: esp32c6-supermini
app: node
net: { link_profile: default }
caps:
  boot:   { cap: fr.button, driver: button_gpio, bind: buttons.boot }
  status: { cap: fr.led,    driver: led_ws2812,  bind: leds.rgb, config: { max_brightness: 64 } }
  tx:     { cap: fr.radio_tx, driver: espnow_tx }   # design csi-c1 D9: the peer source of a CSI receiver (no bind)
