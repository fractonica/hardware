profile: s3l-pad
board: waveshare-esp32s3-lcd19
app: node
net: { link_profile: default }
# Design m2-c5-display D3, decision 7: LVGL's shadow framebuffer (109 KB at 170x320) in the in-package PSRAM.
psram: on
caps:
  boot:   { cap: fr.button,  driver: button_gpio, bind: buttons.boot }
  status: { cap: fr.led,     driver: led_ws2812,  bind: leds.rgb, config: { max_brightness: 64 } }
  lcd:    { cap: fr.display, driver: st7789_spi,  bind: displays.lcd }   # M2-C5: LVGL layouts (design D9)
  tx:     { cap: fr.radio_tx, driver: espnow_tx }   # design csi-c1 D9: the peer source of a CSI receiver (no bind)
