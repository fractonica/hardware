capability: fr.scale
id: 0x000C
version: "1.0"
summary: A weighing scale - a load cell through a 24-bit bridge ADC (HX711), tared and calibrated on the node, reported in milligrams.
doc: |
  `weight_mg` is a LATEST property (latest wins, never retried) reported at most `report_hz` times a second when it
  moved at least `deadband_mg`, so a fast stream never queues behind itself. `settled` is the reliable signal that
  something was put on or taken off. The part converts at its own rate (the HX711's RATE pin: 10 or 80 per second);
  `rate_hz` says what it does. `tare` and `calibrate` average the last `samples` conversions the node already holds,
  so they answer at once; they answer BUSY while the reading is not stable. The offset and the scale factor they set
  are kept across reboots (NVS) until `reset_calibration`. `watch_start` raises the report rate for a bounded time
  (a recording of every conversion) and falls back by itself.
types:
  Filter: { enum: { none: 0, ema: 1, median5: 2 } }
  Gain:   { enum: { a128: 0, a64: 1, b32: 2 } }
traits:
  resolution_bits: { id: 1, type: u8 }      # from the driver: 24 on the HX711
  max_rate_hz:     { id: 2, type: u8 }      # from the driver: the part's fastest conversion rate, 80 on the HX711
config:
  report_hz:     { type: u16, default: 10, range: [1, 100], unit: Hz, doc: "max STATE rate outside a watch; at or above the part's rate (96 at its 80 Hz setting) every conversion is reported" }
  deadband_mg:   { type: u32, default: 100, unit: mg, doc: "a change smaller than this since the last report is not reported (outside a watch)" }
  filter:        { type: Filter, default: ema, doc: "ema: alpha 1/4; median5: the median of the last 5 conversions" }
  gain:          { type: Gain, default: a128, doc: "the channel and gain the clock train selects: a128 (channel A, 128), a64, b32 (channel B, 32)" }
  counts_per_kg: { type: i32, default: 420000, doc: "the scale factor until a calibration is made: raw counts per kilogram (a typical 1-5 kg bar cell at gain 128, inferred)" }
  stable_mg:     { type: u32, default: 500, unit: mg, doc: "stable: the filtered weight stayed within this of its mean for stable_ms" }
  stable_ms:     { type: u16, default: 500, unit: ms }
  settle_min_mg: { type: u32, default: 2000, unit: mg, doc: "`settled` fires only for a stable weight at least this far from the last settled one" }
properties:
  weight_mg:  { id: 1, type: i32, unit: mg, doc: "tared, calibrated and filtered" }
  stable:     { id: 2, type: bool }
  calibrated: { id: 3, type: bool, doc: "a calibration was made and is kept (else config counts_per_kg)" }
  rate_hz:    { id: 4, type: u8, unit: Hz, doc: "conversions over the last second: 80 or 10 by the part's RATE pin, 0 when the part does not answer" }
events:
  settled:
    id: 1
    priority: normal
    doc: "The weight became stable at least settle_min_mg away from the last settled weight: something was put on or taken off."
    fields:
      weight_mg: { id: 1, type: i32, unit: mg }
      delta_mg:  { id: 2, type: i32, unit: mg, doc: "from the last settled weight (the first after boot: from 0)" }
commands:
  tare:
    id: 1
    delivery: reliable
    doc: "The mean raw reading of the last `samples` conversions becomes zero, and is kept across reboots. BUSY while the reading is not stable or fewer conversions are held; FAILED when the part does not answer."
    fields:
      samples: { id: 1, type: u8, default: 16, range: [1, 64] }
    result: { offset: { id: 1, type: i32 }, raw: { id: 2, type: i32 } }
    examples: [ {}, { samples: 32 } ]
  calibrate:
    id: 2
    delivery: reliable
    doc: "With a known mass on the tared scale: the scale factor from the mean of the last `samples` conversions, kept across reboots. BUSY while not stable; INVALID_ARGS for known_mg 0 or a reading at the offset (nothing on the scale)."
    fields:
      known_mg: { id: 1, type: u32, unit: mg }
      samples:  { id: 2, type: u8, default: 16, range: [1, 64] }
    result: { counts_per_kg: { id: 1, type: i32 }, raw: { id: 2, type: i32 } }
    examples: [ { known_mg: 500000 } ]
  read:
    id: 3
    delivery: reliable
    doc: The last conversion and the calibration in use. Answered from what the node holds; never touches the part.
    result:
      raw:           { id: 1, type: i32, doc: "the last conversion, sign-extended from 24 bits" }
      weight_mg:     { id: 2, type: i32, unit: mg }
      offset:        { id: 3, type: i32 }
      counts_per_kg: { id: 4, type: i32 }
      rate_hz:       { id: 5, type: u8, unit: Hz }
      calibrated:    { id: 6, type: bool }
      injected:      { id: 7, type: bool }
  reset_calibration:
    id: 4
    delivery: reliable
    idempotent: true
    doc: Offset 0 and config counts_per_kg again; the kept calibration is erased.
  watch_start:
    id: 5
    delivery: reliable
    doc: "Reports every change up to report_hz (no deadband) for `seconds`, then falls back to config by itself. A newer watch_start replaces the running one."
    fields:
      report_hz: { id: 1, type: u8, default: 80, range: [1, 100], unit: Hz }
      seconds:   { id: 2, type: u16, range: [1, 3600], unit: s }
    examples: [ { seconds: 10 }, { report_hz: 20, seconds: 60 } ]
  watch_stop:
    id: 6
    delivery: reliable
    idempotent: true
    doc: Ends a watch now; OK when none runs.
  inject:
    id: 7
    visibility: test
    delivery: reliable
    doc: Holds `weight_mg` in place of the part for hold_ms (0 means 1,000 ms; at most 60,000). A newer inject replaces it.
    fields: { weight_mg: { id: 1, type: i32, unit: mg }, hold_ms: { id: 2, type: u16 } }
    examples: [ { weight_mg: 250000 }, { weight_mg: 0, hold_ms: 5000 } ]
