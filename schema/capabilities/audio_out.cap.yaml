capability: fr.audio_out
id: 0x0004
version: "1.0"
summary: A speaker or line output that plays a tone made on the node, or PCM it pulls from the hub over HTTP.
doc: |
  Design audio-a1 D2-D5. `tone` needs no network. `play` makes the node GET raw PCM (s16le mono at `sample_hz`) from the
  hub's HTTP listener (`GET /v1/audio/out/<play_id>`), which converted the source to that rate; PCM never travels on
  the hub link. One sound at a time: a new tone or play replaces the one playing (play_done reason stopped).
  play_done reports how each ended; a tone's play_id is 0.
types:
  PlayEndReason: { enum: { done: 0, stopped: 1, net_lost: 2, underrun: 3, error: 4 } }
traits:
  max_sample_hz: { id: 1, type: u32 }       # from the driver: the highest rate it clocks (48000 for i2s_amp)
  bits:          { id: 2, type: u8 }        # from the driver: bits per sample it takes (16 for a MAX98357A)
config:
  volume:    { type: u8,  default: 60, range: [0, 100], unit: "%", doc: "volume at boot" }
  sample_hz: { type: u32, default: 16000, range: [8000, 48000], unit: Hz, doc: "one of 8000, 16000, 22050, 32000, 44100, 48000; the rate tones are made at" }
properties:
  playing: { id: 1, type: bool }
  volume:  { id: 2, type: u8, unit: "%" }
events:
  play_done:
    id: 1
    priority: normal
    doc: "A tone or play ended: done, stopped (stop, or replaced), net_lost, underrun (the stream starved for good), error. underruns counts the silent gaps played."
    fields:
      play_id:   { id: 1, type: u32, doc: "0 for a tone" }
      reason:    { id: 2, type: PlayEndReason }
      underruns: { id: 3, type: u32 }
      samples:   { id: 4, type: u32, doc: "samples played" }
commands:
  tone:
    id: 1
    delivery: reliable
    doc: A sine of freq_hz for ms, made on the node at config sample_hz; answers when it starts. volume overrides the current volume for this tone only.
    fields:
      freq_hz: { id: 1, type: u16, range: [20, 20000], unit: Hz }
      ms:      { id: 2, type: u16, default: 500, range: [1, 60000], unit: ms }
      volume:  { id: 3, type: u8, optional: true, range: [0, 100], unit: "%" }
    examples: [ { freq_hz: 1000, ms: 3000 }, { freq_hz: 440, ms: 500, volume: 30 } ]
  play:
    id: 2
    delivery: reliable
    doc: "Plays PCM the hub serves at GET /v1/audio/out/<play_id> (design D3). Dispatch never blocks: OK once the fr_stream task has the play, INVALID_ARGS for a rate the driver does not take. A GET that fails ends it with play_done net_lost (samples 0)."
    fields:
      play_id:   { id: 1, type: u32, doc: "issued by the hub; the GET path names it" }
      sample_hz: { id: 2, type: u32, range: [8000, 48000], unit: Hz, doc: "the PCM's rate, one of the config's rates" }
    examples: [ { play_id: 1, sample_hz: 16000 } ]
  stop:
    id: 3
    delivery: reliable
    idempotent: true
    doc: Stops the tone or play (play_done reason stopped); OK when nothing plays.
  set_volume:
    id: 4
    delivery: reliable
    idempotent: true
    doc: Sets the volume (property volume) for what plays now and later.
    fields: { volume: { id: 1, type: u8, range: [0, 100], unit: "%" } }
    examples: [ { volume: 40 } ]
