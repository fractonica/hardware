capability: fr.clock
id: 0x0010
version: "1.0"
summary: A battery-backed real-time clock (DS3231) - its time, set from the hub to the second boundary, its temperature, oscillator-stop detection and aging trim.
doc: |
  Design lcd-clock-c1 D7-D8 (as built). `unix` is UTC seconds. The node polls the seconds register (poll_hz, faster near
  the expected rollover) and timestamps each rollover in node time: `read` pairs `unix` with `rollover_us`, the node time
  at which that second began, and the hub derives the RTC's error against its own clock from that pair (the node does
  not know the hub's clock). `set` writes the time so that second `unix` begins at node time `at_us` and clears the
  oscillator-stop flag; `valid` is false while that flag is set (the clock lost power), before a first set, and after the
  chip's time jumped with no set (a stray write on the bus: `lost_power` fires) until the next set. With
  seed_system_time the node's own clock is set from a valid RTC at boot and after each set.
types:
  SetBy: { enum: { command: 0, sync: 1 } }
traits:
  has_temperature: { id: 1, type: bool }
  resolution_ms:   { id: 2, type: u16, doc: "1000 on the DS3231, which counts whole seconds" }
config:
  seed_system_time: { type: bool, default: true }
  poll_hz:          { type: u8, default: 10, range: [1, 50], unit: Hz }
  report_s:         { type: u16, default: 60, range: [1, 3600], unit: s, doc: "how often unix (and offset_ms) are reported" }
properties:
  unix:      { id: 1, type: u32, unit: s }
  valid:     { id: 2, type: bool }
  temp_c10:  { id: 3, type: i16, unit: degC/10, doc: "the chip's temperature, refreshed every 64 s" }
  offset_ms: { id: 4, type: i32, unit: ms, doc: "reported 0 by the node: the hub computes the offset from read's unix and rollover_us (clock_read)" }
events:
  lost_power: { id: 1, priority: normal, doc: "The oscillator-stop flag was set at boot, or the chip's time jumped with no set: the time is not trustworthy until set." }
  set:        { id: 2, priority: normal, fields: { unix: { id: 1, type: u32 }, by: { id: 2, type: SetBy } } }
commands:
  read:
    id: 1
    delivery: reliable
    doc: The latest reading (never waits for the bus).
    result:
      unix:        { id: 1, type: u32 }
      valid:       { id: 2, type: bool }
      osf:         { id: 3, type: bool, doc: "the oscillator-stop flag" }
      temp_c10:    { id: 4, type: i16 }
      aging:       { id: 5, type: i8 }
      offset_ms:   { id: 6, type: i32 }
      rollover_us: { id: 7, type: u64, doc: "node time (esp_timer us) of the last seconds rollover seen" }
      injected:    { id: 8, type: bool }
  set:
    id: 2
    delivery: reliable
    doc: "Second `unix` (2000-2099) begins at node time `at_us` (0 = now): the node waits until then and writes the time in one burst, which restarts the chip's 1 Hz chain, and clears the oscillator-stop flag. INVALID_ARGS for a target more than 2 s ahead or 1 s behind, or a unix outside 2000-2099. It answers at once; the write follows, and `set` fires only when it succeeded (a hub waits for it)."
    fields: { unix: { id: 1, type: u32 }, at_us: { id: 2, type: u64, default: 0 }, by: { id: 3, type: SetBy, default: command } }
  set_aging:
    id: 3
    delivery: reliable
    idempotent: true
    doc: "The aging-offset register: positive slows the clock, about 0.1 ppm per step at 25 degC."
    fields: { offset: { id: 1, type: i8 } }
  inject:
    id: 4
    visibility: test
    delivery: reliable
    doc: Holds `unix` in place of the chip for hold_ms (0 means 1,000; at most 60,000).
    fields: { unix: { id: 1, type: u32 }, hold_ms: { id: 2, type: u16 } }
