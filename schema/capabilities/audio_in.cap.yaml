capability: fr.audio_in
id: 0x0007
version: "1.1"
summary: A microphone (or any analog signal at audio rate) sampled on the node, its level reported, its PCM streamed to the hub over a separate HTTP connection or routed to an output on the same node.
doc: |
  Design audio-a1 D1, D3-D5. PCM never travels on the hub link: stream_start makes the node POST it to the hub's HTTP
  listener (`POST /v1/audio/in/<stream_id>`, chunked, s16le mono at the stream's rate), and stream_ended reports how
  it ended. A stream id is one the hub issued; one stream at a time (BUSY otherwise). Samples lost to a Wi-Fi stall
  are counted in dropped_samples and the hub writes silence for them, so a recording keeps its length.
  `level` is a LATEST property (RMS over the last 1/level_hz s, in dBFS x 10) while the microphone runs.
  1.1 (design audio-a2 D3, additive): the on-board monitor. monitor_start routes this input's converted samples (after
  the DC blocker and gain_db) into an fr.audio_out instance's play ring on the same node, inside the fr_audio task: no
  network, no hub. The output must run this input's sample_hz (both configs; INVALID_ARGS otherwise). While a monitor
  runs the output is busy: a play or tone on it ends the monitor (monitor_ended busy), and monitor_start refuses an
  output that plays (BUSY). `level` reports pause while monitoring (the board's own traffic stays at its heartbeat).
types:
  StreamEndReason: { enum: { stopped: 0, done: 1, net_lost: 2, overflow: 3, error: 4 } }
  MonitorEndReason: { enum: { stopped: 0, done: 1, busy: 2, error: 3 } }
traits:
  max_sample_hz: { id: 1, type: u32 }       # from the driver: the highest rate it clocks (48000 for i2s_mic)
  bits:          { id: 2, type: u8 }        # from the driver: significant bits per sample (24 for an INMP441)
config:
  sample_hz: { type: u32, default: 16000, range: [8000, 48000], unit: Hz, doc: "one of 8000, 16000, 22050, 32000, 44100, 48000; a stream may ask for another" }
  gain_db:   { type: u8,  default: 12, range: [0, 36], unit: dB, doc: "digital gain applied in the 32 -> 16-bit conversion" }
  hpf_hz:    { type: u16, default: 20, range: [0, 500], unit: Hz, doc: "DC blocker corner; 0: off" }
  level_hz:  { type: u8,  default: 5,  range: [0, 20], unit: Hz, doc: "`level` reports per second while the microphone runs; 0: none" }
properties:
  level:      { id: 1, type: i16, unit: dBFS/10, doc: "RMS over the last 1/level_hz s, dBFS x 10 (-900 is silence); paused while monitoring" }
  streaming:  { id: 2, type: bool }
  monitoring: { id: 3, type: bool, doc: "a monitor runs (1.1): monitor_start to monitor_ended" }
events:
  stream_ended:
    id: 1
    priority: normal
    doc: "A stream ended: stopped (stream_stop), done (`seconds` reached), net_lost (a send stalled 3 s or the connection dropped), overflow, error."
    fields:
      stream_id:       { id: 1, type: u32 }
      reason:          { id: 2, type: StreamEndReason }
      samples:         { id: 3, type: u32, doc: "samples covered by the stream, dropped ones included" }
      dropped_samples: { id: 4, type: u32, doc: "samples lost to ring overflows (the hub writes silence for them)" }
  monitor_ended:
    id: 2
    priority: normal
    doc: "A monitor ended (1.1): stopped (monitor_stop), done (`seconds` reached), busy (a play or tone took the output), error (the source or the output failed)."
    fields:
      reason:  { id: 1, type: MonitorEndReason }
      to_port: { id: 2, type: u8, doc: "the output it fed" }
      samples: { id: 3, type: u32, doc: "samples routed to the output" }
commands:
  stream_start:
    id: 1
    delivery: reliable
    doc: "Starts streaming to the hub over HTTP (design D3). Dispatch never blocks: OK once the fr_stream task has the stream, BUSY while another runs (or a monitor runs at another rate), INVALID_ARGS for a rate the driver does not take. A connection that cannot be opened ends the stream with stream_ended net_lost (samples 0)."
    fields:
      stream_id: { id: 1, type: u32, doc: "issued by the hub; the POST path names it" }
      seconds:   { id: 2, type: u16, unit: s, doc: "0: until stream_stop" }
      sample_hz: { id: 3, type: u32, optional: true, unit: Hz, doc: "absent: config sample_hz; one of the config's rates" }
    result:
      sample_hz: { id: 1, type: u32, unit: Hz, doc: "the rate of the stream" }
    examples: [ { stream_id: 1, seconds: 10 }, { stream_id: 2, seconds: 5, sample_hz: 48000 } ]
  stream_stop:
    id: 2
    delivery: reliable
    idempotent: true
    doc: Ends stream `stream_id` (stream_ended reason stopped); NOT_FOUND when it is not the running stream.
    fields: { stream_id: { id: 1, type: u32 } }
    examples: [ { stream_id: 1 } ]
  level_get:
    id: 3
    delivery: reliable
    doc: The level now, in dBFS x 10, and the clipped samples since the microphone started; starts the microphone for 200 ms when it is idle.
    result:
      dbfs_x10:      { id: 1, type: i16 }
      peak_dbfs_x10: { id: 2, type: i16 }
      clipping:      { id: 3, type: u32 }
  monitor_start:
    id: 4
    delivery: reliable
    doc: "Routes this input to fr.audio_out port to_port on the same node (1.1, design audio-a2 D3). Dispatch never blocks: OK once fr_audio has the monitor. INVALID_ARGS: to_port is not an fr.audio_out instance, or its sample_hz differs from this input's. BUSY: this input already monitors, or streams at another rate; or the output plays, or another input monitors to it. Ends with monitor_ended."
    fields:
      to_port: { id: 1, type: u8, doc: "the fr.audio_out instance's capability port" }
      seconds: { id: 2, type: u16, unit: s, doc: "0: until monitor_stop" }
      volume:  { id: 3, type: u8, range: [0, 100], unit: "%", doc: "0: the output's own volume; else this monitor's only" }
    examples: [ { to_port: 4, seconds: 30, volume: 0 }, { to_port: 4, seconds: 0, volume: 60 } ]
  monitor_stop:
    id: 5
    delivery: reliable
    idempotent: true
    doc: Ends the monitor (monitor_ended reason stopped); OK when none runs.
