[package]
name = "qonu-fw"
version = "0.1.0"
edition = "2024"
description = "STM32U585 firmware for the qonu link on the Arduino UNO Q"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
qonu-link-proto = { path = "../proto" }
embassy-stm32 = { version = "0.6.0", features = ["stm32u585ai", "time-driver-any", "memory-x", "unstable-pac"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5.1", features = ["tick-hz-32_768"] }
embassy-sync = "0.8.0"
cortex-m = { version = "0.7.10", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.7"
static_cell = "2.1.1"
embedded-graphics = "0.8.2"
profont = "0.7.0"
heapless = { version = "0.9.3", default-features = false }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2          # symbols stay in the ELF for gdb; flash size is unaffected
panic = "abort"
incremental = false

[profile.dev]
opt-level = 1
panic = "abort"
