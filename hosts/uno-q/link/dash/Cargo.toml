[package]
name = "qonu-dash"
version = "0.1.0"
edition = "2024"
description = "Linux vitals dashboard for the UNO Q's SPI display, drawn through the qonu link"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
serde_json = "1"
libc = "0.2"
qrcode = { version = "0.14", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
