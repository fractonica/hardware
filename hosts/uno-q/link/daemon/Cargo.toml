[package]
name = "qonu-link"
version = "0.1.0"
edition = "2024"
description = "Linux side of the qonu link: owns /dev/ttyHS1 to the UNO Q's STM32 and serves a JSON-lines socket"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
qonu-link-proto = { path = "../proto" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
libc = "0.2"
heapless = { version = "0.9.3", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
