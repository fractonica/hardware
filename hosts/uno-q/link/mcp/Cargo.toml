[package]
name = "qonu-mcp"
version = "0.1.0"
edition = "2024"
description = "MCP server for the UNO Q: exposes the qonu link (LED matrix, RGB LED, status) as tools over stdio"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
qonu-link-proto = { path = "../proto" }
rmcp = { version = "3.9.0", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "io-util", "io-std", "time"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
schemars = "1.2.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
