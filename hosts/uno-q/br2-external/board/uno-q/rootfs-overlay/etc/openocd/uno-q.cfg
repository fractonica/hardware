# STM32U585 on the Arduino UNO Q, reached over SWD bit-banged on the QRB2210's
# TLMM GPIOs (gpiochip1). Line numbers match Arduino's own config for "imola".
adapter driver linuxgpiod
adapter gpio swdio 25 -chip 1
adapter gpio swclk 26 -chip 1
adapter gpio srst 38 -chip 1

transport select swd
source [find target/stm32u5x.cfg]

# linuxgpiod bit-bangs at a fixed rate and cannot change speed. The target
# script's reset handlers call "adapter speed", which would fail; keep the rest.
$_TARGETNAME configure -event reset-start {}
$_TARGETNAME configure -event reset-init { stm32u5x_clock_config }
