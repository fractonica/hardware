# Answer <hostname>.local on every link that enables MulticastDNS.
# DNSSEC off: the board boots without a valid clock (read-only RTC), and with a
# wrong clock every signature fails validation, so names never resolve and NTP
# can never fix the clock. Buildroot enables allow-downgrade whenever OpenSSL is in.
[Resolve]
MulticastDNS=yes
LLMNR=no
DNSSEC=no
