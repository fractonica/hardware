[Unit]
StartLimitIntervalSec=0

[Service]
# Only an ed25519 host key (instant to generate); skipped if one was baked in.
ExecStartPre=
ExecStartPre=/bin/sh -c 'test -s /etc/ssh/ssh_host_ed25519_key || /usr/bin/ssh-keygen -q -t ed25519 -N "" -f /etc/ssh/ssh_host_ed25519_key'
Restart=always
RestartSec=2
