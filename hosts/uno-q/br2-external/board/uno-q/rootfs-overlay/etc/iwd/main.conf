[General]
# systemd-networkd handles IP configuration (DHCP) once iwd associates.
EnableNetworkConfiguration=false
AddressRandomization=disabled

[Network]
NameResolvingService=systemd

[DriverQuirks]
# Power save on the WCN3990 (ath10k_snoc) adds 15-80 ms to every packet: the board answered the router in 23 ms on
# average instead of 2.5, and the Mac in 82 ms instead of 6. Costs a little power; the board runs on mains.
PowerSaveDisable=ath10k_snoc
