# Answer raphael.local on every link that enables MulticastDNS.
# DNSSEC off: the Pi has no RTC and boots with a wrong clock, every signature then fails validation,
# names never resolve and NTP can never fix the clock. Buildroot enables allow-downgrade whenever OpenSSL is in.
[Resolve]
MulticastDNS=yes
LLMNR=no
DNSSEC=no
