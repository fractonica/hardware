[General]
# systemd-networkd handles IP configuration (DHCP) once iwd associates.
EnableNetworkConfiguration=false
AddressRandomization=disabled

[Network]
NameResolvingService=systemd

[DriverQuirks]
# Wi-Fi power save delays packets until the radio's next wake-up (on the UNO Q it added 15-80 ms to every
# packet). The Pi runs on mains.
PowerSaveDisable=brcmfmac
# Keep the kernel's wlan0 instead of deleting and re-creating it, which brcmfmac handles badly.
DefaultInterface=brcmfmac
