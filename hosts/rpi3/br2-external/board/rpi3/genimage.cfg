# SD card: a FAT boot partition the GPU firmware reads, and the ext4 root filesystem.
image boot.vfat {
	vfat {
		extraargs = "-n RAPHAEL"
		files = {
			"rpi-firmware/bootcode.bin",
			"rpi-firmware/start_cd.elf",
			"rpi-firmware/fixup_cd.dat",
			"rpi-firmware/config.txt",
			"rpi-firmware/cmdline.txt",
			"rpi-firmware/overlays",
			"bcm2710-rpi-3-b.dtb",
			"bcm2710-rpi-3-b-plus.dtb",
			"kernel8.img"
		}
	}
	size = 64M
}

image sdcard.img {
	hdimage {
		disk-signature = 0x52415048
		# Partitions on 4 MiB boundaries, a multiple of SD card erase blocks
		align = 4M
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
